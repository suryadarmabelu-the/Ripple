<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ripple — Chat</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RIPPLE — design tokens
   ============================================================ */
:root {
  --bg: #0E141B;
  --bg-elevated: #141C25;
  --sidebar: #10161E;
  --surface: #1B2530;
  --surface-2: #232F3C;
  --border: #263140;
  --text: #E8EDF2;
  --text-dim: #8A97A6;
  --primary: #16A3A8;
  --primary-dark: #0E7A7E;
  --accent: #F2B134;
  --bubble-sent-start: #16A3A8;
  --bubble-sent-end: #0E7A7E;
  --bubble-received: #1F2A36;
  --danger: #E5484D;
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
  --font-display: "Space Grotesk", sans-serif;
  --font-body: "Inter", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

button, input {
  font-family: inherit;
  color: inherit;
}

.hidden { display: none !important; }

/* ============================================================
   Signature element — concentric "ripple" rings
   ============================================================ */
.ripple-mark {
  position: relative;
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ripple-mark.big { width: 96px; height: 96px; margin: 0 auto 20px; }
.ripple-mark .ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid var(--primary);
  opacity: 0;
  animation: rippleOut 3s ease-out infinite;
}
.ripple-mark .r1 { width: 24px; height: 24px; animation-delay: 0s; }
.ripple-mark .r2 { width: 24px; height: 24px; animation-delay: 1s; }
.ripple-mark .r3 { width: 24px; height: 24px; animation-delay: 2s; }
.ripple-mark .dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 14px rgba(242,177,52,.6);
}
@keyframes rippleOut {
  0% { width: 14px; height: 14px; opacity: .9; border-color: var(--accent); }
  100% { width: 90px; height: 90px; opacity: 0; border-color: var(--primary); }
}
@media (prefers-reduced-motion: reduce) {
  .ripple-mark .ring { animation: none; opacity: .35; width: 60px; height: 60px; }
}

/* ============================================================
   AUTH PAGE
   ============================================================ */
.auth-body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background:
    radial-gradient(circle at 15% 20%, rgba(22,163,168,.16), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(242,177,52,.10), transparent 40%),
    var(--bg);
}
.auth-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
  max-width: 900px;
  width: 100%;
  align-items: center;
}
.auth-brand h1 {
  font-family: var(--font-display);
  font-size: 42px;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
}
.auth-brand p { color: var(--text-dim); font-size: 15px; max-width: 320px; }

.auth-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-l);
  padding: 28px;
}
.auth-tabs { display: flex; gap: 4px; background: var(--surface); border-radius: var(--radius-m); padding: 4px; margin-bottom: 22px; }
.auth-tab {
  flex: 1; padding: 10px; border: none; background: transparent; border-radius: var(--radius-s);
  cursor: pointer; font-weight: 600; color: var(--text-dim); transition: .15s;
}
.auth-tab.is-active { background: var(--primary); color: #06181A; }

.auth-form { display: flex; flex-direction: column; gap: 16px; }
.auth-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-dim); }
.auth-form input {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-s);
  padding: 12px 14px; font-size: 15px; outline: none;
}
.auth-form input:focus { border-color: var(--primary); }
.auth-error { color: var(--danger); font-size: 13px; min-height: 16px; margin: 0; }
.auth-hint { color: var(--primary); font-size: 13px; margin: 0; }

.btn-primary {
  background: linear-gradient(135deg, var(--bubble-sent-start), var(--bubble-sent-end));
  border: none; color: #04191A; font-weight: 700; padding: 12px; border-radius: var(--radius-s);
  cursor: pointer; font-size: 15px;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  padding: 12px; border-radius: var(--radius-s); cursor: pointer; font-weight: 600;
}

@media (max-width: 720px) {
  .auth-wrap { grid-template-columns: 1fr; text-align: center; }
  .auth-brand p { margin: 0 auto; }
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app-body { height: 100vh; overflow: hidden; }
.app-shell {
  display: grid;
  grid-template-columns: 340px 1fr;
  height: 100%;
}

.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px; border-bottom: 1px solid var(--border);
}
.me { display: flex; align-items: center; gap: 10px; }
.me-info { display: flex; flex-direction: column; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
.status-dot.online { background: var(--primary); box-shadow: 0 0 6px var(--primary); }
.sidebar-actions { display: flex; gap: 6px; }

.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; color: #071417;
  flex-shrink: 0; text-transform: uppercase;
}

.icon-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 38px; height: 38px; border-radius: var(--radius-s);
  cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--surface-2); }

.contact-list { flex: 1; overflow-y: auto; padding: 8px; }
.empty-hint { color: var(--text-dim); font-size: 13px; padding: 16px; text-align: center; }

.contact-item {
  display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-m);
  cursor: pointer; margin-bottom: 4px; border: 1px solid transparent;
}
.contact-item:hover { background: var(--surface); }
.contact-item.is-active { background: var(--surface-2); border-color: var(--primary); }
.contact-item .ci-info { flex: 1; min-width: 0; }
.contact-item strong { display: block; font-size: 14.5px; }
.contact-item .ci-preview { color: var(--text-dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.contact-item .ci-time { color: var(--text-dim); font-size: 11px; font-family: var(--font-mono); }

/* ============================================================
   CHAT PANEL
   ============================================================ */
.chat-panel { display: flex; flex-direction: column; background: var(--bg); position: relative; }
.chat-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--text-dim); padding: 24px;
}
.chat-empty h2 { font-family: var(--font-display); color: var(--text); font-weight: 500; margin: 0 0 8px; }

.chat-active { display: flex; flex-direction: column; height: 100%; }
.chat-header {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  border-bottom: 1px solid var(--border); background: var(--bg-elevated);
}
.chat-header-info { flex: 1; display: flex; flex-direction: column; }
.chat-header-info span { font-size: 12px; color: var(--text-dim); }
.back-btn { display: none; }
.call-btn { font-size: 18px; }

.messages {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;
}
.bubble-row { display: flex; }
.bubble-row.mine { justify-content: flex-end; }
.bubble {
  max-width: 62%; padding: 10px 14px; border-radius: var(--radius-m); font-size: 14.5px; line-height: 1.45;
  position: relative;
}
.bubble-row.mine .bubble {
  background: linear-gradient(135deg, var(--bubble-sent-start), var(--bubble-sent-end));
  color: #052627; border-bottom-right-radius: 4px;
}
.bubble-row.theirs .bubble {
  background: var(--bubble-received); border-bottom-left-radius: 4px;
}
.bubble .b-time {
  display: block; font-family: var(--font-mono); font-size: 10px; opacity: .65; margin-top: 4px; text-align: right;
}
.msg-delete-btn {
  position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--danger); color: #2A0708; border: 2px solid var(--bg); font-size: 11px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  opacity: 0; transition: opacity .15s; padding: 0;
}
.bubble-row.mine:hover .msg-delete-btn,
.bubble-row.mine .msg-delete-btn:focus-visible { opacity: 1; }
@media (hover: none) {
  .msg-delete-btn { opacity: .6; }
}
.bubble img.b-media { max-width: 240px; border-radius: var(--radius-s); display: block; margin-bottom: 6px; }
.bubble a.b-file {
  display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit;
  background: rgba(0,0,0,.15); padding: 8px 10px; border-radius: var(--radius-s); margin-bottom: 4px; font-size: 13px;
}

.composer {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-top: 1px solid var(--border); background: var(--bg-elevated);
}
.composer input[type=text] {
  flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 11px 16px; outline: none; font-size: 14.5px;
}
.composer input[type=text]:focus { border-color: var(--primary); }
.btn-send {
  width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--bubble-sent-start), var(--bubble-sent-end)); color: #052627; font-size: 16px;
}

/* ============================================================
   MODALS
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(6,10,14,.72); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.modal {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-l);
  padding: 24px; width: 100%; max-width: 380px; text-align: center;
}
.modal h3 { font-family: var(--font-display); margin: 0 0 6px; }
.modal-sub { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; }
.modal form { display: flex; flex-direction: column; gap: 12px; }
.modal input[type=email] {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-s);
  padding: 12px 14px; font-size: 14.5px; outline: none; text-align: left;
}
.modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }

.modal-camera video, .modal-camera img { width: 100%; border-radius: var(--radius-m); background: #000; margin-bottom: 4px; max-height: 320px; object-fit: cover; }

.call-incoming .ripple-mark { margin: 0 auto 12px; }
.btn-accept, .btn-decline {
  border: none; border-radius: var(--radius-s); padding: 12px 20px; font-weight: 700; cursor: pointer; font-size: 14px;
}
.btn-accept { background: var(--primary); color: #04191A; }
.btn-decline { background: var(--danger); color: #2A0708; }

/* ============================================================
   ACTIVE CALL
   ============================================================ */
.call-active {
  position: fixed; inset: 0; background: #05080B; z-index: 60;
  display: flex; align-items: center; justify-content: center;
}
#remoteVideo { width: 100%; height: 100%; object-fit: cover; }
#localVideo {
  position: absolute; bottom: 100px; right: 24px; width: 150px; height: 200px;
  object-fit: cover; border-radius: var(--radius-m); border: 2px solid var(--primary); background: #111;
}
.call-status {
  position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.5); padding: 8px 16px; border-radius: 999px; font-size: 13px; color: var(--text-dim);
}
.call-controls {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 14px;
}
.call-controls .icon-btn { width: 52px; height: 52px; border-radius: 50%; font-size: 20px; }
.call-controls .btn-decline { width: 52px; height: 52px; border-radius: 50%; font-size: 20px; transform: rotate(135deg); }
.call-toggle.is-off { background: var(--danger); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 860px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: absolute; inset: 0; z-index: 10; }
  .sidebar.is-collapsed { display: none; }
  .chat-panel.is-collapsed { display: none; }
  .back-btn { display: flex; }
  #localVideo { width: 100px; height: 140px; bottom: 90px; right: 16px; }
}

</style>
</head>
<body class="app-body">

<div class="app-shell">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <header class="sidebar-header">
      <div class="me">
        <div class="avatar" id="myAvatar">?</div>
        <div class="me-info">
          <strong id="myUsername">—</strong>
          <span class="status-dot online"></span>

      </div>

      </div>
    </header>

          <span id="peerStatus">offline</span>
        </div>
        <button class="icon-btn" id="deleteChatBtn" title="Hapus percakapan">🗑️</button>

      </form>
    </div>
  </main>

</div>

<!-- ===================== MODAL: TAMBAH KONTAK ===================== -->
<div class="modal-backdrop hidden" id="addContactModal">
  <div class="modal">
    <h3>Tambah kontak</h3>
    <p class="modal-sub">Masukkan email pengguna Ripple lain.</p>
    <form id="addContactForm">
      <input type="email" id="contactEmailInput" placeholder="email@contoh.com" required />
      <p class="auth-error" id="addContactError"></p>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelAddContact">Batal</button>
        <button type="submit" class="btn-primary">Tambah</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== MODAL: KAMERA ===================== -->
<div class="modal-backdrop hidden" id="cameraModal">
  <div class="modal modal-camera">
    <h3>Ambil foto</h3>
    <video id="cameraPreview" autoplay playsinline muted></video>
    <canvas id="cameraCanvas" hidden></canvas>
    <img id="cameraSnapshot" hidden alt="Hasil foto" />
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="cancelCamera">Batal</button>
      <button type="button" class="icon-btn" id="flipCameraBtn" title="Ganti kamera depan/belakang">🔄</button>
      <button type="button" class="btn-primary" id="shootBtn">Jepret</button>
      <button type="button" class="btn-primary hidden" id="sendSnapshotBtn">Kirim foto</button>
      <button type="button" class="btn-ghost hidden" id="retakeBtn">Ulangi</button>
    </div>
  </div>
</div>

<!-- ===================== OVERLAY: PANGGILAN MASUK ===================== -->
<div class="modal-backdrop hidden" id="incomingCallModal">
  <div class="modal call-incoming">
    <div class="ripple-mark" aria-hidden="true"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="dot"></span></div>
    <h3 id="incomingCallFrom">Seseorang</h3>
    <p>Video call masuk…</p>
    <div class="modal-actions">
      <button type="button" class="btn-decline" id="declineCallBtn">Tolak</button>
      <button type="button" class="btn-accept" id="acceptCallBtn">Terima</button>
    </div>
  </div>
</div>

<!-- ===================== OVERLAY: PANGGILAN AKTIF ===================== -->
<div class="modal-backdrop hidden" id="activeCallModal">
  <div class="call-active">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="call-status" id="callStatusText">Menghubungkan…</div>
    <div class="call-controls">
      <button type="button" class="icon-btn call-toggle" id="toggleMicBtn" title="Mikrofon">🎙️</button>
      <button type="button" class="icon-btn call-toggle" id="toggleCamBtn" title="Kamera">📷</button>
      <button type="button" class="icon-btn" id="flipCamBtn" title="Ganti kamera depan/belakang">🔄</button>
      <button type="button" class="icon-btn" id="fullscreenBtn" title="Layar penuh">⛶</button>
      <button type="button" class="btn-decline" id="hangupBtn" title="Akhiri panggilan">📞</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ============================================================
// ISI DUA NILAI DI BAWAH INI dengan milik proyek Supabase kamu
// Ambil dari: Supabase Dashboard > Project Settings > API
// (anon key aman ditaruh di kode publik karena dibatasi oleh RLS)
// ============================================================
const SUPABASE_URL = "https://nfwyfvlqjlxsaokyoncu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5md3lmdmxxamx4c2Fva3lvbmN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwODI1NjUsImV4cCI6MjEwMDY1ODU2NX0.pFgVpEoI3OlE0SmaQSK2jd2x--wIZBl8XNUUwykSeyk";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});

// Public key VAPID untuk Web Push (aman ditaruh di kode publik — cuma
// dipakai browser untuk memverifikasi server, bukan buat mengirim apa-apa).
// Private key-nya TIDAK di sini, hanya ada di secret Edge Function.
const VAPID_PUBLIC_KEY =
  "BErvMJAH0apPA-eBI2fx5PR2YaIXTQ5iKq3rEclZiv3LGna5aG5aQTnZ1XK739eEw1-u4GqRsfBmy1jZQQn3GHM";

// ---- logika video call (WebRTC) ----
const ICE_SERVERS = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
  ],
};

let myId = null;
let myChannel = null;
let pc = null;
let localStream = null;
let currentCallId = null;
let currentPeerId = null;
let pendingIce = [];
let remoteDescSet = false;
let currentFacingMode = "user";

// Dipanggil sekali saat aplikasi dimulai
function initSignaling(userId, handlers) {
  myId = userId;
  myChannel = supabase.channel(`call-${myId}`);
  myChannel
    .on("broadcast", { event: "offer" }, ({ payload }) => handlers.onOffer(payload))
    .on("broadcast", { event: "answer" }, ({ payload }) => handleAnswer(payload))
    .on("broadcast", { event: "ice" }, ({ payload }) => handleRemoteIce(payload))
    .on("broadcast", { event: "hangup" }, ({ payload }) => handlers.onHangup(payload))
    .on("broadcast", { event: "decline" }, ({ payload }) => handlers.onDecline(payload))
    .subscribe();
}

function sendSignal(targetId, event, payload) {
  const ch = supabase.channel(`call-${targetId}`);
  ch.subscribe((status) => {
    if (status === "SUBSCRIBED") {
      ch.send({ type: "broadcast", event, payload });
      setTimeout(() => supabase.removeChannel(ch), 2000);
    }
  });
}

async function getMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  return localStream;
}

function buildPeerConnection(targetId) {
  const conn = new RTCPeerConnection(ICE_SERVERS);
  conn.onicecandidate = (e) => {
    if (e.candidate) {
      sendSignal(targetId, "ice", { callId: currentCallId, from: myId, candidate: e.candidate });
    }
  };
  return conn;
}

// ============ CALLER SIDE ============
async function startCall(peerId, myUsername, onLocalStream, onRemoteStream, onStateChange) {
  currentCallId = crypto.randomUUID();
  currentPeerId = peerId;
  remoteDescSet = false;
  pendingIce = [];
  currentFacingMode = "user";

  const stream = await getMedia();
  onLocalStream(stream);

  pc = buildPeerConnection(peerId);
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  pc.ontrack = (e) => onRemoteStream(e.streams[0]);
  pc.onconnectionstatechange = () => onStateChange(pc.connectionState);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  sendSignal(peerId, "offer", {
    callId: currentCallId,
    from: myId,
    fromUsername: myUsername,
    sdp: offer,
  });

  return currentCallId;
}

// ============ CALLEE SIDE ============
async function acceptCall(offerPayload, onLocalStream, onRemoteStream, onStateChange) {
  currentCallId = offerPayload.callId;
  currentPeerId = offerPayload.from;
  remoteDescSet = false;
  pendingIce = [];
  currentFacingMode = "user";

  const stream = await getMedia();
  onLocalStream(stream);

  pc = buildPeerConnection(offerPayload.from);
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  pc.ontrack = (e) => onRemoteStream(e.streams[0]);
  pc.onconnectionstatechange = () => onStateChange(pc.connectionState);

  await pc.setRemoteDescription(new RTCSessionDescription(offerPayload.sdp));
  remoteDescSet = true;
  flushPendingIce();

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  sendSignal(offerPayload.from, "answer", { callId: currentCallId, from: myId, sdp: answer });
}

function declineCall(offerPayload) {
  sendSignal(offerPayload.from, "decline", { callId: offerPayload.callId });
}

async function handleAnswer(payload) {
  if (payload.callId !== currentCallId || !pc) return;
  await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
  remoteDescSet = true;
  flushPendingIce();
}

async function handleRemoteIce(payload) {
  if (payload.callId !== currentCallId) return;
  if (!pc) return;
  if (!remoteDescSet) {
    pendingIce.push(payload.candidate);
    return;
  }
  try {
    await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
  } catch (err) {
    console.warn("Gagal menambah ICE candidate", err);
  }
}

function flushPendingIce() {
  pendingIce.forEach((c) => pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}));
  pendingIce = [];
}

function hangupCall() {
  if (currentPeerId && currentCallId) {
    sendSignal(currentPeerId, "hangup", { callId: currentCallId });
  }
  cleanupCall();
}

function cleanupCall() {
  if (pc) {
    pc.close();
    pc = null;
  }
  if (localStream) {
    localStream.getTracks().forEach((t) => t.stop());
    localStream = null;
  }
  currentCallId = null;
  currentPeerId = null;
  pendingIce = [];
  remoteDescSet = false;
}

function getCurrentCallId() {
  return currentCallId;
}

function toggleTrack(kind, enabled) {
  if (!localStream) return;
  localStream.getTracks().filter((t) => t.kind === kind).forEach((t) => (t.enabled = enabled));
}

// Ganti kamera depan <-> belakang selama panggilan aktif
async function switchCamera() {
  if (!localStream) return null;
  currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
  const oldVideoTrack = localStream.getVideoTracks()[0];

  let newStream;
  try {
    newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: currentFacingMode } },
      audio: false,
    });
  } catch (err) {
    // Perangkat mungkin cuma punya satu kamera / tidak cocok persis — coba tanpa "exact"
    newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode },
      audio: false,
    });
  }
  const newVideoTrack = newStream.getVideoTracks()[0];
  newVideoTrack.enabled = oldVideoTrack ? oldVideoTrack.enabled : true;

  if (pc) {
    const sender = pc.getSenders().find((s) => s.track && s.track.kind === "video");
    if (sender) await sender.replaceTrack(newVideoTrack);
  }

  if (oldVideoTrack) {
    localStream.removeTrack(oldVideoTrack);
    oldVideoTrack.stop();
  }
  localStream.addTrack(newVideoTrack);

  return localStream;
}

// Buat baris profil kalau belum ada (mis. login pertama kali setelah
// konfirmasi email, sehingga profil belum sempat dibuat saat daftar).
async function ensureProfile(session) {
  const { data: existing } = await supabase
    .from("profiles").select("*").eq("id", session.user.id).single();
  if (existing) return existing;

  const base = session.user.user_metadata?.username || session.user.email.split("@")[0];

  for (let attempt = 0; attempt < 3; attempt++) {
    const uname = attempt === 0 ? base : `${base}${Math.floor(1000 + Math.random() * 9000)}`;
    const { data: created, error: createErr } = await supabase
      .from("profiles")
      .insert({ id: session.user.id, email: session.user.email, username: uname })
      .select()
      .single();
    if (!created && createErr && !String(createErr.message).toLowerCase().includes("username")) {
      console.error(createErr);
      return null;
    }
    if (created) return created;
  }
  return null;
}

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = "index.html"; return; }

  const profile = await ensureProfile(session);
  if (!profile) {
    await supabase.auth.signOut();
    window.location.href = "index.html";
    return;
  }

  me = profile;
  els.myUsername.textContent = me.username;
  els.myAvatar.textContent = me.username[0];

  setupPresence();
  Call.initSignaling(me.id, callHandlers);
  setupGlobalMessageWatcher();
  wireUI();
  await loadContacts();

  document.addEventListener("click", unlockAudio, { once: true });
  const permission = await requestNotifPermission();
  if (permission === "granted") setupPushNotifications();
}

// PRESENCE (status online)
// ============================================================
function setupPresence() {
  presenceChannel = supabase.channel("presence-online", {
    config: { presence: { key: me.id } },
  });
  presenceChannel
    .on("presence", { event: "sync" }, () => {
      onlineIds = new Set(Object.keys(presenceChannel.presenceState()));
      renderContactList();
      updatePeerStatus();
    })
    .subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        await presenceChannel.track({ online_at: new Date().toISOString() });
      }
    });
}

async function loadContacts() {
  const { data, error } = await supabase
    .from("contacts")
    .select("contact:contact_id(id, username, email, avatar_url, status_message)")
    .eq("owner_id", me.id);

  if (error) {
    console.error(error);
    els.contactList.innerHTML = `<p class="empty-hint">Gagal memuat kontak.</p>`;
    return;
  }
  contacts = (data || []).map((r) => r.contact).filter(Boolean);
  renderContactList();
}

function renderContactList() {
  els.contactList.innerHTML = "";
  if (contacts.length === 0) {
    els.contactList.innerHTML = `<p class="empty-hint">Belum ada kontak.<br>Tekan tombol ＋ untuk menambah.</p>`;
    return;
  }
  contacts
    .slice()
    .sort((a, b) => a.username.localeCompare(b.username))
    .forEach((c) => {
      const item = document.createElement("div");
      item.className = "contact-item" + (activePeer && activePeer.id === c.id ? " is-active" : "");
      item.innerHTML = `
        <div class="avatar">${escapeHtml(c.username[0])}</div>
        <div class="ci-info">
          <strong>${escapeHtml(c.username)}</strong>
          <span class="ci-preview">${onlineIds.has(c.id) ? "Online" : "Offline"}</span>
        </div>
      `;
      item.addEventListener("click", () => openConversationWith(c));
      els.contactList.appendChild(item);
    });
}

function updatePeerStatus() {
  if (!activePeer) return;
  els.peerStatus.textContent = onlineIds.has(activePeer.id) ? "Online" : "Offline";
}

async function openConversationWith(peer) {
  activePeer = peer;
  els.chatEmpty.classList.add("hidden");
  els.chatActive.classList.remove("hidden");
  els.peerUsername.textContent = peer.username;
  els.peerAvatar.textContent = peer.username[0];
  updatePeerStatus();
  renderContactList();

  els.sidebar.classList.add("is-collapsed");
  els.chatPanel.classList.remove("is-collapsed");

  const userA = me.id < peer.id ? me.id : peer.id;
  const userB = me.id < peer.id ? peer.id : me.id;

  let { data: conv } = await supabase
    .from("conversations").select("*")
    .eq("user_a", userA).eq("user_b", userB).maybeSingle();

  if (!conv) {
    const { data: newConv, error } = await supabase
      .from("conversations").insert({ user_a: userA, user_b: userB }).select().single();
    if (error) { console.error(error); return; }
    conv = newConv;
  }
  activeConversation = conv;

  await loadMessages(conv.id);
  subscribeToMessages(conv.id);
}

async function loadMessages(conversationId) {
  const { data, error } = await supabase
    .from("messages").select("*")
    .eq("conversation_id", conversationId)
    .order("created_at", { ascending: true });

  els.messages.innerHTML = "";
  if (error) { console.error(error); return; }
  (data || []).forEach(renderMessage);
  scrollMessagesToBottom();
}

async function deleteConversation() {
  if (!activeConversation || !activePeer) return;
  if (!confirm(`Hapus semua percakapan dengan ${activePeer.username}? Tindakan ini tidak bisa dibatalkan.`)) return;

  const convId = activeConversation.id;

  const { error: msgErr } = await supabase.from("messages").delete().eq("conversation_id", convId);
  if (msgErr) {
    alert("Gagal menghapus pesan: " + msgErr.message);
    return;
  }
  const { error: convErr } = await supabase.from("conversations").delete().eq("id", convId);
  if (convErr) {
    alert("Gagal menghapus percakapan: " + convErr.message);
    return;
  }

  if (messagesChannel) { supabase.removeChannel(messagesChannel); messagesChannel = null; }
  els.messages.innerHTML = "";
  activeConversation = null;
  activePeer = null;
  els.chatActive.classList.add("hidden");
  els.chatEmpty.classList.remove("hidden");
  els.sidebar.classList.remove("is-collapsed");
  els.chatPanel.classList.add("is-collapsed");
  renderContactList();
}

function subscribeToMessages(conversationId) {
  if (messagesChannel) supabase.removeChannel(messagesChannel);
  messagesChannel = supabase
    .channel(`messages-${conversationId}`)
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "messages", filter: `conversation_id=eq.${conversationId}` },
      (payload) => { renderMessage(payload.new); scrollMessagesToBottom(); }
    )
    .on(
      "postgres_changes",
      { event: "DELETE", schema: "public", table: "messages", filter: `conversation_id=eq.${conversationId}` },
      (payload) => { removeMessageEl(payload.old.id); }
    )
    .subscribe();
}

function renderMessage(msg) {
  const row = document.createElement("div");
  row.className = "bubble-row " + (msg.sender_id === me.id ? "mine" : "theirs");
  row.dataset.msgId = msg.id;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (msg.file_url) {
    if ((msg.file_type || "").startsWith("image/")) {
      const img = document.createElement("img");
      img.className = "b-media";
      img.src = msg.file_url;
      img.alt = msg.file_name || "gambar";
      bubble.appendChild(img);
    } else {
      const a = document.createElement("a");
      a.className = "b-file";
      a.href = msg.file_url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "📎 " + (msg.file_name || "Berkas");
      bubble.appendChild(a);
    }
  }

  if (msg.content) {
    const p = document.createElement("div");
    p.textContent = msg.content;
    bubble.appendChild(p);
  }

  const time = document.createElement("span");
  time.className = "b-time";
  time.textContent = formatTime(msg.created_at);
  bubble.appendChild(time);

  if (msg.sender_id === me.id) {
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "msg-delete-btn";
    delBtn.title = "Hapus pesan";
    delBtn.textContent = "✕";
    delBtn.addEventListener("click", () => deleteMessage(msg.id));
    bubble.appendChild(delBtn);
  }

  row.appendChild(bubble);
  els.messages.appendChild(row);
}

async function deleteMessage(id) {
  if (!confirm("Hapus pesan ini?")) return;
  const { error } = await supabase.from("messages").delete().eq("id", id);
  if (error) {
    alert("Gagal menghapus pesan: " + error.message);
    return;
  }
  removeMessageEl(id);
}

function removeMessageEl(id) {
  const el = els.messages.querySelector(`[data-msg-id="${id}"]`);
  if (el) el.remove();
}

function scrollMessagesToBottom() {
  els.messages.scrollTop = els.messages.scrollHeight;
}

async function uploadAndSend(file) {
  if (!activeConversation) return;
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `${me.id}/${Date.now()}_${safeName}`;

  const { error: upErr } = await supabase.storage.from("attachments").upload(path, file);
  if (upErr) { alert("Gagal mengunggah berkas: " + upErr.message); return; }

  const { data: pub } = supabase.storage.from("attachments").getPublicUrl(path);

  const { error } = await supabase.from("messages").insert({
    conversation_id: activeConversation.id,
    sender_id: me.id,
    file_url: pub.publicUrl,
    file_type: file.type || "application/octet-stream",
    file_name: file.name,
  });
  if (error) console.error(error);
}

async function openCameraModal() {
  els.cameraModal.classList.remove("hidden");
  resetCameraView();
  cameraFacingMode = "user";
  await startCameraStream();
}

async function startCameraStream() {
  if (cameraStream) { cameraStream.getTracks().forEach((t) => t.stop()); cameraStream = null; }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: cameraFacingMode } } });
  } catch (err) {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: cameraFacingMode } });
    } catch (err2) {
      alert("Tidak bisa mengakses kamera: " + err2.message);
      closeCameraModal();
      return;
    }
  }
  els.cameraPreview.srcObject = cameraStream;
}

function flipCameraModal() {
  cameraFacingMode = cameraFacingMode === "user" ? "environment" : "user";
  startCameraStream();
}

function closeCameraModal() {
  if (cameraStream) { cameraStream.getTracks().forEach((t) => t.stop()); cameraStream = null; }
  els.cameraModal.classList.add("hidden");
}

function resetCameraView() {
  els.cameraPreview.hidden = false;
  els.cameraSnapshot.hidden = true;
  els.shootBtn.classList.remove("hidden");
  els.flipCameraBtn.classList.remove("hidden");
  els.sendSnapshotBtn.classList.add("hidden");
  els.retakeBtn.classList.add("hidden");
}

function shootPhoto() {
  const video = els.cameraPreview;
  const canvas = els.cameraCanvas;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  els.cameraSnapshot.src = canvas.toDataURL("image/jpeg", 0.9);
  els.cameraSnapshot.hidden = false;
  els.cameraPreview.hidden = true;
  els.shootBtn.classList.add("hidden");
  els.flipCameraBtn.classList.add("hidden");
  els.sendSnapshotBtn.classList.remove("hidden");
  els.retakeBtn.classList.remove("hidden");
}

function sendSnapshot() {
  els.cameraCanvas.toBlob(async (blob) => {
    const file = new File([blob], `foto_${Date.now()}.jpg`, { type: "image/jpeg" });
    await uploadAndSend(file);
    closeCameraModal();
  }, "image/jpeg", 0.9);
}

// ============================================================
// NOTIFIKASI (pesan / panggilan masuk saat tab Ripple tidak aktif dilihat)
//
// Ini hanya berfungsi kalau tab/browser MASIH TERBUKA (boleh di tab lain,
// window di-minimize, atau lagi buka percakapan berbeda). Kalau tab atau
// browsernya benar-benar ditutup, JS di halaman ini tidak jalan sama sekali —
// itu butuh Web Push + Service Worker + server terpisah (lain cerita).
// ============================================================

// Minta izin notifikasi begitu user sudah login & masuk ke halaman chat
function requestNotifPermission() {
  if (!("Notification" in window)) return Promise.resolve("unsupported");
  if (Notification.permission !== "default") return Promise.resolve(Notification.permission);
  return Notification.requestPermission().catch(() => "denied");
}

// ---- Push notification (jalan walau tab/browser sudah ditutup) ----
// Butuh service worker (sw.js) di root domain + tabel push_subscriptions
// di Supabase + Edge Function "send-push". Lihat SETUP-PUSH.md.
async function setupPushNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  if (Notification.permission !== "granted") return;

  try {
    const registration = await navigator.serviceWorker.register("/sw.js");
    let subscription = await registration.pushManager.getSubscription();

    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }

    const raw = subscription.toJSON();
    await supabase.from("push_subscriptions").upsert(
      {
        user_id: me.id,
        endpoint: raw.endpoint,
        p256dh: raw.keys.p256dh,
        auth: raw.keys.auth,
      },
      { onConflict: "endpoint" }
    );
  } catch (err) {
    // Browser tidak mendukung, izin ditolak belakangan, atau offline — abaikan diam-diam
    console.warn("Push notification tidak aktif:", err.message);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

// Minta Edge Function mengirim push ke lawan bicara saat kita menelepon —
// ini yang menjangkau dia kalau Ripple-nya sedang tertutup total.
async function notifyCallViaPush(targetUserId, fromUsername) {
  try {
    await supabase.functions.invoke("send-push", {
      body: { kind: "call", targetUserId, fromUsername },
    });
  } catch (err) {
    // Kalau gagal (mis. edge function belum di-deploy), panggilan tetap
    // jalan seperti biasa lewat Realtime untuk yang aplikasinya masih terbuka
    console.warn("Push panggilan gagal dikirim:", err.message);
  }
}

// Browser umumnya memblokir audio sebelum ada interaksi user. "Buka kunci"
// AudioContext begitu user klik apa saja pertama kali di halaman ini.
function unlockAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (err) { /* browser tidak mendukung Web Audio, abaikan */ }
}

// Bunyi "ding" pendek untuk pesan masuk
function playPingSound() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(880, t0);
  osc.frequency.exponentialRampToValueAtTime(660, t0 + 0.15);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.4);
}

// Nada dering berulang untuk panggilan masuk
function startRingSound() {
  if (ringInterval) return;
  const ringOnce = () => {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    [0, 0.28].forEach((offset) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(740, t0 + offset);
      gain.gain.setValueAtTime(0.0001, t0 + offset);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + offset + 0.24);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0 + offset);
      osc.stop(t0 + offset + 0.26);
    });
  };
  ringOnce();
  ringInterval = setInterval(ringOnce, 1800);
}

function stopRingSound() {
  if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
}

// Judul tab berkedip-kedip antara teks asli <-> pesan notifikasi
function startTitleFlash(text) {
  stopTitleFlash();
  let showAlert = true;
  titleFlashTimer = setInterval(() => {
    document.title = showAlert ? text : ORIGINAL_TITLE;
    showAlert = !showAlert;
  }, 1200);
}
function stopTitleFlash() {
  if (titleFlashTimer) { clearInterval(titleFlashTimer); titleFlashTimer = null; }
  document.title = ORIGINAL_TITLE;
}

// Begitu tab kembali dilihat, hentikan semua alert visual/suara
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) stopTitleFlash();
});
window.addEventListener("focus", () => {
  stopTitleFlash();
});

// Tampilkan notifikasi sistem operasi (muncul walau tab di background/minimize)
function showBrowserNotification(title, body, tag) {
  if (!("Notification" in window) || Notification.permission !== "granted") return null;
  try {
    const notif = new Notification(title, {
      body,
      tag,          // notifikasi dengan tag sama akan menumpuk jadi satu, tidak numpuk-numpuk
      renotify: true,
      icon: undefined,
    });
    notif.onclick = () => {
      window.focus();
      notif.close();
    };
    return notif;
  } catch (err) {
    return null;
  }
}

// Cari username pengirim (pakai cache biar tidak query berulang-ulang)
async function resolveUsername(userId) {
  if (profileNameCache.has(userId)) return profileNameCache.get(userId);
  const { data } = await supabase.from("profiles").select("username").eq("id", userId).single();
  const uname = data?.username || "Seseorang";
  profileNameCache.set(userId, uname);
  return uname;
}

// Dipasang sekali saat login: memantau SEMUA pesan baru yang masuk untuk kita
// (bukan cuma percakapan yang sedang dibuka), supaya bisa dikasih notifikasi
// walau lagi ada di percakapan lain atau tab-nya di background.
function setupGlobalMessageWatcher() {
  if (globalMessagesChannel) supabase.removeChannel(globalMessagesChannel);
  globalMessagesChannel = supabase
    .channel(`global-messages-${me.id}`)
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "messages" },
      async (payload) => {
        const msg = payload.new;
        if (msg.sender_id === me.id) return; // pesan kita sendiri, abaikan

        const isOpenAndVisible =
          activeConversation &&
          msg.conversation_id === activeConversation.id &&
          document.hasFocus() &&
          !document.hidden;

        if (isOpenAndVisible) return; // sudah kelihatan langsung di layar, tak perlu notif

        const senderName = await resolveUsername(msg.sender_id);
        const preview = msg.file_url ? "📎 Mengirim berkas" : (msg.content || "Pesan baru");

        playPingSound();
        if (document.hidden || !document.hasFocus()) {
          startTitleFlash("💬 Pesan baru — Ripple");
        }
        showBrowserNotification(`Pesan baru dari ${senderName}`, preview, `msg-${msg.conversation_id}`);
      }
    )
    .subscribe();
}

// ============================================================
// VIDEO CALL
// ============================================================
const callHandlers = {
  onOffer(payload) {
    if (Call.getCurrentCallId()) return; // sedang di panggilan lain, abaikan
    pendingOffer = payload;
    els.incomingCallFrom.textContent = payload.fromUsername || "Seseorang";
    els.incomingCallModal.classList.remove("hidden");

    startRingSound();
    if (document.hidden || !document.hasFocus()) {
      startTitleFlash("📞 Panggilan masuk — Ripple");
    }
    showBrowserNotification(
      "Panggilan video masuk",
      `${payload.fromUsername || "Seseorang"} meneleponmu di Ripple`,
      `call-${payload.callId}`
    );
  },
  onHangup(payload) {
    if (payload.callId === Call.getCurrentCallId()) endCallUI();
    els.incomingCallModal.classList.add("hidden");
    stopRingSound();
    stopTitleFlash();
  },
  onDecline() {
    els.callStatusText.textContent = "Panggilan ditolak";
    setTimeout(endCallUI, 1200);
  },
};

// ============================================================
// LAYAR PENUH (Fullscreen API)
// ============================================================
function requestCallFullscreen() {
  const el = els.activeCallModal;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (!req) return; // browser tidak mendukung (mis. Safari iPhone) — video tetap penuh via CSS
  try {
    const result = req.call(el);
    if (result && typeof result.catch === "function") {
      result.catch(() => { /* diblokir browser, abaikan diam-diam */ });
    }
  } catch (err) { /* abaikan */ }
}

function exitCallFullscreen() {
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) return;
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if (!exit) return;
  try {
    const result = exit.call(document);
    if (result && typeof result.catch === "function") result.catch(() => {});
  } catch (err) { /* abaikan */ }
}

function updateFullscreenBtn() {
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  els.fullscreenBtn.textContent = isFs ? "🗗" : "⛶";
  els.fullscreenBtn.title = isFs ? "Keluar layar penuh" : "Layar penuh";
}

async function startOutgoingCall() {
  if (!activePeer) return;
  micOn = true; camOn = true;
  els.toggleMicBtn.classList.remove("is-off");
  els.toggleCamBtn.classList.remove("is-off");
  els.activeCallModal.classList.remove("hidden");
  requestCallFullscreen();
  els.callStatusText.textContent = "Memanggil " + activePeer.username + "…";
  try {
    await Call.startCall(activePeer.id, me.username, onLocalStream, onRemoteStream, onConnState);
    notifyCallViaPush(activePeer.id, me.username); // jaga-jaga kalau Ripple lawan bicara sedang tertutup
  } catch (err) {
    alert("Tidak bisa mengakses kamera/mikrofon: " + err.message);
    endCallUI();
  }
}

async function onAcceptCall() {
  if (!pendingOffer) return;
  els.incomingCallModal.classList.add("hidden");
  stopRingSound();
  stopTitleFlash();
  micOn = true; camOn = true;
  els.toggleMicBtn.classList.remove("is-off");
  els.toggleCamBtn.classList.remove("is-off");
  els.activeCallModal.classList.remove("hidden");
  requestCallFullscreen();
  els.callStatusText.textContent = "Menghubungkan…";
  try {
    await Call.acceptCall(pendingOffer, onLocalStream, onRemoteStream, onConnState);
    els.callStatusText.textContent = "Tersambung";
  } catch (err) {
    alert("Gagal menerima panggilan: " + err.message);
    endCallUI();
  }
  pendingOffer = null;
}

function onDeclineCall() {
  if (pendingOffer) Call.declineCall(pendingOffer);
  pendingOffer = null;
  els.incomingCallModal.classList.add("hidden");
  stopRingSound();
  stopTitleFlash();
}

function onLocalStream(stream) { els.localVideo.srcObject = stream; }
function onRemoteStream(stream) {
  els.remoteVideo.srcObject = stream;
  els.callStatusText.textContent = "Tersambung";
}
function onConnState(state) {
  if (state === "disconnected" || state === "failed" || state === "closed") endCallUI();
}

function endCallUI() {
  Call.cleanupCall();
  exitCallFullscreen();
  els.activeCallModal.classList.add("hidden");
  els.localVideo.srcObject = null;
  els.remoteVideo.srcObject = null;
}

// ============================================================
// HELPERS
// ============================================================
function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
