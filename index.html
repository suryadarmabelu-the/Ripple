<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ripple — Masuk</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RIPPLE — design tokens
   ============================================================ */
:root {
  --bg: #0E141B;
  --bg-elevated: #141C25;
  --sidebar: #10161E;
  --surface: #1B2530;
  --surface-2: #232F3C;
  --border: #263140;
  --text: #E8EDF2;
  --text-dim: #8A97A6;
  --primary: #16A3A8;
  --primary-dark: #0E7A7E;
  --accent: #F2B134;
  --bubble-sent-start: #16A3A8;
  --bubble-sent-end: #0E7A7E;
  --bubble-received: #1F2A36;
  --danger: #E5484D;
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
  --font-display: "Space Grotesk", sans-serif;
  --font-body: "Inter", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

button, input {
  font-family: inherit;
  color: inherit;
}

.hidden { display: none !important; }

/* ============================================================
   Signature element — concentric "ripple" rings
   ============================================================ */
.ripple-mark {
  position: relative;
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ripple-mark.big { width: 96px; height: 96px; margin: 0 auto 20px; }
.ripple-mark .ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid var(--primary);
  opacity: 0;
  animation: rippleOut 3s ease-out infinite;
}
.ripple-mark .r1 { width: 24px; height: 24px; animation-delay: 0s; }
.ripple-mark .r2 { width: 24px; height: 24px; animation-delay: 1s; }
.ripple-mark .r3 { width: 24px; height: 24px; animation-delay: 2s; }
.ripple-mark .dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 14px rgba(242,177,52,.6);
}
@keyframes rippleOut {
  0% { width: 14px; height: 14px; opacity: .9; border-color: var(--accent); }
  100% { width: 90px; height: 90px; opacity: 0; border-color: var(--primary); }
}
@media (prefers-reduced-motion: reduce) {
  .ripple-mark .ring { animation: none; opacity: .35; width: 60px; height: 60px; }
}

/* ============================================================
   AUTH PAGE
   ============================================================ */
.auth-body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background:
    radial-gradient(circle at 15% 20%, rgba(22,163,168,.16), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(242,177,52,.10), transparent 40%),
    var(--bg);
}
.auth-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
  max-width: 900px;
  width: 100%;
  align-items: center;
}
.auth-brand h1 {
  font-family: var(--font-display);
  font-size: 42px;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
}
.auth-brand p { color: var(--text-dim); font-size: 15px; max-width: 320px; }

.auth-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-l);
  padding: 28px;
}
.auth-tabs { display: flex; gap: 4px; background: var(--surface); border-radius: var(--radius-m); padding: 4px; margin-bottom: 22px; }
.auth-tab {
  flex: 1; padding: 10px; border: none; background: transparent; border-radius: var(--radius-s);
  cursor: pointer; font-weight: 600; color: var(--text-dim); transition: .15s;
}
.auth-tab.is-active { background: var(--primary); color: #06181A; }

.auth-form { display: flex; flex-direction: column; gap: 16px; }
.auth-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-dim); }
.auth-form input {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-s);
  padding: 12px 14px; font-size: 15px; outline: none;
}
.auth-form input:focus { border-color: var(--primary); }
.auth-error { color: var(--danger); font-size: 13px; min-height: 16px; margin: 0; }
.auth-hint { color: var(--primary); font-size: 13px; margin: 0; }

.btn-primary {
  background: linear-gradient(135deg, var(--bubble-sent-start), var(--bubble-sent-end));
  border: none; color: #04191A; font-weight: 700; padding: 12px; border-radius: var(--radius-s);
  cursor: pointer; font-size: 15px;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  padding: 12px; border-radius: var(--radius-s); cursor: pointer; font-weight: 600;
}

@media (max-width: 720px) {
  .auth-wrap { grid-template-columns: 1fr; text-align: center; }
  .auth-brand p { margin: 0 auto; }
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app-body { height: 100vh; overflow: hidden; }
.app-shell {
  display: grid;
  grid-template-columns: 340px 1fr;
  height: 100%;
}

.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px; border-bottom: 1px solid var(--border);
}
.me { display: flex; align-items: center; gap: 10px; }
.me-info { display: flex; flex-direction: column; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
.status-dot.online { background: var(--primary); box-shadow: 0 0 6px var(--primary); }
.sidebar-actions { display: flex; gap: 6px; }

.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; color: #071417;
  flex-shrink: 0; text-transform: uppercase;
}

.icon-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 38px; height: 38px; border-radius: var(--radius-s);
  cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--surface-2); }

.contact-list { flex: 1; overflow-y: auto; padding: 8px; }
.empty-hint { color: var(--text-dim); font-size: 13px; padding: 16px; text-align: center; }

.contact-item {
  display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-m);
  cursor: pointer; margin-bottom: 4px; border: 1px solid transparent;
}
.contact-item:hover { background: var(--surface); }
.contact-item.is-active { background: var(--surface-2); border-color: var(--primary); }
.contact-item .ci-info { flex: 1; min-width: 0; }
.contact-item strong { display: block; font-size: 14.5px; }
.contact-item .ci-preview { color: var(--text-dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.contact-item .ci-time { color: var(--text-dim); font-size: 11px; font-family: var(--font-mono); }

/* ============================================================
   CHAT PANEL
   ============================================================ */
.chat-panel { display: flex; flex-direction: column; background: var(--bg); position: relative; }
.chat-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--text-dim); padding: 24px;
}
.chat-empty h2 { font-family: var(--font-display); color: var(--text); font-weight: 500; margin: 0 0 8px; }

.chat-active { display: flex; flex-direction: column; height: 100%; }
.chat-header {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  border-bottom: 1px solid var(--border); background: var(--bg-elevated);
}
.chat-header-info { flex: 1; display: flex; flex-direction: column; }
.chat-header-info span { font-size: 12px; color: var(--text-dim); }
.back-btn { display: none; }
.call-btn { font-size: 18px; }

.messages {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;
}
.bubble-row { display: flex; }
.bubble-row.mine { justify-content: flex-end; }
.bubble {
  max-width: 62%; padding: 10px 14px; border-radius: var(--radius-m); font-size: 14.5px; line-height: 1.45;
  position: relative;
}
.bubble-row.mine .bubble {
  background: linear-gradient(135deg, var(--bubble-sent-start), var(--bubble-sent-end));
  color: #052627; border-bottom-right-radius: 4px;
}
.bubble-row.theirs .bubble {
  background: var(--bubble-received); border-bottom-left-radius: 4px;
}
.bubble .b-time {
  display: block; font-family: var(--font-mono); font-size: 10px; opacity: .65; margin-top: 4px; text-align: right;
}
.bubble img.b-media { max-width: 240px; border-radius: var(--radius-s); display: block; margin-bottom: 6px; }
.bubble a.b-file {
  display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit;
  background: rgba(0,0,0,.15); padding: 8px 10px; border-radius: var(--radius-s); margin-bottom: 4px; font-size: 13px;
}

.composer {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-top: 1px solid var(--border); background: var(--bg-elevated);
}
.composer input[type=text] {
  flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 11px 16px; outline: none; font-size: 14.5px;
}
.composer input[type=text]:focus { border-color: var(--primary); }
.btn-send {
  width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--bubble-sent-start), var(--bubble-sent-end)); color: #052627; font-size: 16px;
}

/* ============================================================
   MODALS
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(6,10,14,.72); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.modal {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-l);
  padding: 24px; width: 100%; max-width: 380px; text-align: center;
}
.modal h3 { font-family: var(--font-display); margin: 0 0 6px; }
.modal-sub { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; }
.modal form { display: flex; flex-direction: column; gap: 12px; }
.modal input[type=email] {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-s);
  padding: 12px 14px; font-size: 14.5px; outline: none; text-align: left;
}
.modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }

.modal-camera video, .modal-camera img { width: 100%; border-radius: var(--radius-m); background: #000; margin-bottom: 4px; max-height: 320px; object-fit: cover; }

.call-incoming .ripple-mark { margin: 0 auto 12px; }
.btn-accept, .btn-decline {
  border: none; border-radius: var(--radius-s); padding: 12px 20px; font-weight: 700; cursor: pointer; font-size: 14px;
}
.btn-accept { background: var(--primary); color: #04191A; }
.btn-decline { background: var(--danger); color: #2A0708; }

/* ============================================================
   ACTIVE CALL
   ============================================================ */
.call-active {
  position: fixed; inset: 0; background: #05080B; z-index: 60;
  display: flex; align-items: center; justify-content: center;
}
#remoteVideo { width: 100%; height: 100%; object-fit: cover; }
#localVideo {
  position: absolute; bottom: 100px; right: 24px; width: 150px; height: 200px;
  object-fit: cover; border-radius: var(--radius-m); border: 2px solid var(--primary); background: #111;
}
.call-status {
  position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.5); padding: 8px 16px; border-radius: 999px; font-size: 13px; color: var(--text-dim);
}
.call-controls {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 14px;
}
.call-controls .icon-btn { width: 52px; height: 52px; border-radius: 50%; font-size: 20px; }
.call-controls .btn-decline { width: 52px; height: 52px; border-radius: 50%; font-size: 20px; transform: rotate(135deg); }
.call-toggle.is-off { background: var(--danger); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 860px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: absolute; inset: 0; z-index: 10; }
  .sidebar.is-collapsed { display: none; }
  .chat-panel.is-collapsed { display: none; }
  .back-btn { display: flex; }
  #localVideo { width: 100px; height: 140px; bottom: 90px; right: 16px; }
}

</style>
</head>
<body class="auth-body">

  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="ripple-mark" aria-hidden="true">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <span class="dot"></span>
      </div>
      <h1>Ripple</h1>
      <p>Chat, kirim file, dan video call — langsung dari browser.</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab is-active" type="button">Masuk</button>
        <button id="tabRegister" class="auth-tab" type="button">Daftar</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label>
          <span>Email</span>
          <input type="email" id="loginEmail" required autocomplete="email" placeholder="kamu@email.com" />
        </label>
        <label>
          <span>Kata sandi</span>
          <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <button type="submit" class="btn-primary">Masuk</button>
        <p class="auth-error" id="loginError"></p>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <label>
          <span>Nama pengguna</span>
          <input type="text" id="registerUsername" required minlength="3" maxlength="24" placeholder="mis. dinda_p" />
        </label>
        <label>
          <span>Email</span>
          <input type="email" id="registerEmail" required autocomplete="email" placeholder="kamu@email.com" />
        </label>
        <label>
          <span>Kata sandi</span>
          <input type="password" id="registerPassword" required minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter" />
        </label>
        <button type="submit" class="btn-primary">Buat akun</button>
        <p class="auth-error" id="registerError"></p>
        <p class="auth-hint" id="registerHint"></p>
      </form>
    </div>
  </div>

  <script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ============================================================
// ISI DUA NILAI DI BAWAH INI dengan milik proyek Supabase kamu
// Ambil dari: Supabase Dashboard > Project Settings > API
// (anon key aman ditaruh di kode publik karena dibatasi oleh RLS)
// ============================================================
const SUPABASE_URL = "https://nfwyfvlqjlxsaokyoncu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5md3lmdmxxamx4c2Fva3lvbmN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwODI1NjUsImV4cCI6MjEwMDY1ODU2NX0.pFgVpEoI3OlE0SmaQSK2jd2x--wIZBl8XNUUwykSeyk";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});

const tabLogin = document.getElementById("tabLogin");
const tabRegister = document.getElementById("tabRegister");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

tabLogin.addEventListener("click", () => switchTab("login"));
tabRegister.addEventListener("click", () => switchTab("register"));

function switchTab(which) {
  const isLogin = which === "login";
  tabLogin.classList.toggle("is-active", isLogin);
  tabRegister.classList.toggle("is-active", !isLogin);
  loginForm.classList.toggle("hidden", !isLogin);
  registerForm.classList.toggle("hidden", isLogin);
}

// Kalau sudah login, langsung lempar ke halaman chat
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = "chat.html";
});

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("loginError");
  errorEl.textContent = "";

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    errorEl.textContent = terjemahkanError(error.message);
    return;
  }
  window.location.href = "chat.html";
});

registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("registerError");
  const hintEl = document.getElementById("registerHint");
  errorEl.textContent = "";
  hintEl.textContent = "";

  const username = document.getElementById("registerUsername").value.trim();
  const email = document.getElementById("registerEmail").value.trim();
  const password = document.getElementById("registerPassword").value;

  const { data, error } = await supabase.auth.signUp({ email, password });
  if (error) {
    errorEl.textContent = terjemahkanError(error.message);
    return;
  }

  // Jika project mewajibkan konfirmasi email, session belum ada di sini.
  if (!data.session) {
    hintEl.textContent = "Akun dibuat! Cek email kamu untuk konfirmasi, lalu masuk di tab Masuk.";
    switchTab("login");
    return;
  }

  const { error: profileError } = await supabase.from("profiles").insert({
    id: data.user.id,
    email,
    username,
  });

  if (profileError) {
    errorEl.textContent = "Akun dibuat, tapi profil gagal disimpan: " + profileError.message;
    return;
  }

  window.location.href = "chat.html";
});

function terjemahkanError(msg) {
  if (msg.includes("Invalid login credentials")) return "Email atau kata sandi salah.";
  if (msg.includes("already registered")) return "Email sudah terdaftar. Coba masuk.";
  if (msg.includes("duplicate key value") && msg.includes("username")) return "Nama pengguna sudah dipakai.";
  return msg;
}

</script>
</body>
</html>
